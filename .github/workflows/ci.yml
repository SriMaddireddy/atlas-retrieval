name: Verify Atlas
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/evaluate.py --output evaluation-ci.json
      - run: python scripts/benchmark.py --output benchmark-ci.json
      - run: docker compose up --build -d --wait
      - run: python scripts/http_smoke.py --output http-smoke-ci.json
      - if: always()
        run: docker compose logs > docker-ci.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-verification
          path: |
            *-ci.json
            docker-ci.log
      - if: always()
        run: docker compose down
